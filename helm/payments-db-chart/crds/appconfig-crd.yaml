apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appconfigs.migration.broadcom.com
  labels:
    app.kubernetes.io/name: payments-db
    app.kubernetes.io/managed-by: Helm
spec:
  group: migration.broadcom.com
  names:
    plural: appconfigs
    singular: appconfig
    kind: AppConfig
    shortNames:
      - appcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                slaTier:
                  type: string
                wave:
                  type: string
                rpoHours:
                  type: integer
                rtoMinutes:
                  type: integer
                owner:
                  type: string
                databaseRef:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                lastVerified:
                  type: string
                migrationReady:
                  type: boolean
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tier
          type: string
          jsonPath: .spec.slaTier
        - name: Wave
          type: string
          jsonPath: .spec.wave
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Status
          type: string
          jsonPath: .status.phase
