apiVersion: migration.broadcom.com/v1alpha1
kind: AppConfig
metadata:
  name: {{ .Release.Name }}-metadata
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
spec:
  slaTier: {{ .Values.appConfig.slaTier | quote }}
  wave: {{ .Values.appConfig.wave | quote }}
  rpoHours: {{ .Values.appConfig.rpoHours }}
  rtoMinutes: {{ .Values.appConfig.rtoMinutes }}
  owner: {{ .Values.appConfig.owner | quote }}
  databaseRef: {{ .Release.Name }}-svc
