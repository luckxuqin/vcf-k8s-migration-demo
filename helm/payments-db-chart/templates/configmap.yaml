apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  postgresql.conf: |
    listen_addresses = '*'
    max_connections = 100
    shared_buffers = 128MB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    wal_level = replica
    synchronous_commit = on
    logging_collector = on
    log_destination = 'stderr'
  init-data.sql: |
    CREATE TABLE IF NOT EXISTS payment_transactions (
        transaction_id SERIAL PRIMARY KEY,
        account_id VARCHAR(32) NOT NULL,
        merchant_id VARCHAR(32) NOT NULL,
        amount NUMERIC(12, 2) NOT NULL,
        currency VARCHAR(3) DEFAULT 'USD',
        status VARCHAR(16) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        payload_hash VARCHAR(64)
    );

    CREATE INDEX IF NOT EXISTS idx_trans_account ON payment_transactions(account_id);
    CREATE INDEX IF NOT EXISTS idx_trans_created ON payment_transactions(created_at);

    -- Seed {{ .Values.database.seedRows }} transactions
    INSERT INTO payment_transactions (account_id, merchant_id, amount, currency, status, created_at, payload_hash)
    SELECT
        'ACCT-' || LPAD((1000 + (g % 500))::text, 6, '0'),
        'MERCH-' || LPAD((200 + (g % 50))::text, 4, '0'),
        ROUND(((g * 17.35) % 1500 + 5.0)::numeric, 2),
        'USD',
        CASE WHEN g % 20 = 0 THEN 'REFUNDED'
             WHEN g % 15 = 0 THEN 'PENDING'
             ELSE 'COMPLETED' END,
        NOW() - (g || ' minutes')::interval,
        MD5(g::text || '-VCF9-VKS-MIGRATION')
    FROM generate_series(1, {{ .Values.database.seedRows }}) AS g
    ON CONFLICT DO NOTHING;

    -- Create verification view for fast validation
    CREATE OR REPLACE VIEW migration_integrity_summary AS
    SELECT
        COUNT(*) AS total_rows,
        MIN(transaction_id) AS min_id,
        MAX(transaction_id) AS max_id,
        SUM(amount) AS total_amount,
        MD5(STRING_AGG(payload_hash, ',' ORDER BY transaction_id)) AS aggregate_checksum
    FROM payment_transactions;
