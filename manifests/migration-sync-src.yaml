apiVersion: v1
kind: Pod
metadata:
  name: migration-sync-src
  namespace: migration-demo
spec:
  containers:
  - name: sync
    image: postgres:16-alpine
    command: ["sleep", "3600"]
    volumeMounts:
    - name: vol
      mountPath: /data
      readOnly: true
  volumes:
  - name: vol
    persistentVolumeClaim:
      claimName: data-payments-db-0
