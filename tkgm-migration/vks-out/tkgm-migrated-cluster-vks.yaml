apiVersion: migration.vmware.com/v1alpha1
kind: BlockingWarning
metadata:
  name: tkgm-migrated-cluster-vsphere-prune
spec:
  matrixCell: matrix.infra.vspheremachine.prune
  message: vSphere infrastructure fields (datacenter, datastore, folder, resourcePool,
    network) were dropped from VSphereMachineTemplate during conversion to VKS topology.
  remediation: |
    STRIP: VSphereCluster and VSphereMachineTemplate fields (vCenter credentials, datastores, networks, resource pools) are managed by the Supervisor namespace. These fields must NOT be present in the VKS cluster spec. Applies to both legacy clusters (KubeadmControlPlane-based) and classy clusters with VSphereMachineTemplates (e.g. SR-IOV DirectPath).
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  annotations:
    converted-from: legacy-tkg-m-cluster
    original-cluster: tkgm-workload-01
    original-cni: antrea
    run.tanzu.vmware.com/resolve-os-image: os-name=photon
  labels:
    tkg.tanzu.vmware.com/cluster-name: tkgm-migrated-cluster
  name: tkgm-migrated-cluster
  namespace: vks-migration-demo
spec:
  topology:
    classRef:
      name: builtin-generic-v3.6.0
      namespace: vmware-system-vks-public
    controlPlane:
      metadata:
        labels:
          cluster-role: control-plane
      replicas: 1
      variables:
        overrides:
        - name: vmClass
          value: tkgm-migrated-cluster-control-plane-2cpu-8gb
        - name: storageClass
          value: vsan-esa-default-policy-raid5
    variables:
    - name: vmClass
      value: tkgm-migrated-cluster-control-plane-2cpu-8gb
    - name: storageClass
      value: vsan-esa-default-policy-raid5
    - name: kubernetes
      value:
        certificateRotation:
          enabled: true
          renewalDaysBeforeExpiry: 90
    version: v1.28.4+vmware.1
    workers:
      machineDeployments:
      - class: node-pool
        metadata:
          labels:
            node-pool: tkgm-workload-01-md-0-worker-pool
        name: tkgm-workload-01
        replicas: 2
        variables:
          overrides:
          - name: vmClass
            value: tkgm-migrated-cluster-tkgm-workload-01-4cpu-16gb
          - name: storageClass
            value: vsan-esa-default-policy-raid5
